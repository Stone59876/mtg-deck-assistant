services:
  db:
    image: postgres:18
    container_name: mtg-deck-assistant-dev
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: mtg_deck_assistant
    ports:
      - "5433:5432"
    volumes:
      - mtg_deck_assistant_data:/var/lib/postgresql

volumes:
  mtg_deck_assistant_data: