services:
  db:
    image: postgres:18
    container_name: mtg-deck-assistant-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: mtg_deck_assistant
    ports:
      - "5433:5432"
    volumes:
      - mtg_deck_assistant_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  mtg-assistant-app:
    image: mtg-deck-assistant:latest
    container_name: mtg-deck-assistant-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/mtg_deck_assistant
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  mtg_deck_assistant_data: